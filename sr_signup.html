<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Recipient Sign Up for EMA4KIDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="welcome_note">
        <h2>Add to EMA4KIDS family</h2>
        <p>Sign up a new scholarship recipient!</p>
    </div>
    <div class="success">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="error">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="form">
        <form action="" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">First Name</label>
                <input type="text" id="name" name="firstname">
            </div>
            <div class="form-group">
                <label for="name">Last Name</label>
                <input type="text" id="name" name="lastname">
            </div>
            <div class="form-group">
                <label for="name">Middle Name</label>
                <input type="text" id="name" name="middlename">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country">
                <!-- <select name="country" id="country">
                    <option value="">Select a country</option>
                    <option value="Nigeria">Nigeria</option>
                    <option value="Benin Republic">Benin Republic</option>
                    <option value="India">India</option>
                    <option value="West Bank">West Bank</option>
                    <option value="United States">United States</option>
                </select> -->
            </div>
            <div class="form-group">
                <label for="state">State of Origin</label>
                <input type="text" id="state" name="state_of_origin">
            </div>
            <div class="form-group">
                <label for="create_password">Create Password</label>
                <input type="password" id="create_password" name="create_password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password">
            </div>
            <div class="form-group">
                <label for="avatar">Avatar</label>
                <input type="file" id="avatar" name="avatar">
            </div>
            <div class="form-group">
                <label for="DOB">Date of Birth</label>
                <input type="date" id="DOB" name="date_of_birth">
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
