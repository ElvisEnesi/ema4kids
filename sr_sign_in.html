<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Recipient Sign In to EMA4KIDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="welcome_note">
        <h2>Welcome to EMA4KIDS</h2>
        <p>Sign in to get started!</p>
    </div>
    <div class="success">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="error">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="form">
        <form action="" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="key">Password</label>
                <input type="password" id="key" name="key">
            </div>
            <div class="form_group">
                <label for="show_password">Show password</label>
                <input type="checkbox" onclick="showPassword()" id="show_password" name="show_password">
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>

</body>
</html>
