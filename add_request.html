<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA4KIDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="welcome_note">
        <h2>Make a request</h2>
    </div>
    <div class="success">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="error">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam aperiam laboriosam cumque a, saepe sapiente ab.
    </div>
    <div class="form">
        <form action="" method="post">
            <div class="form-group">
                <label for="request">Description</label>
                <textarea name="request" id="request" placeholder="Your request!!"></textarea>
            </div>
            <div class="form-group">
                <label for="date_of_request">Date needed for the request</label>
                <input type="date" id="date_of_request" name="date_of_request">
            </div>
            <button type="submit">Submit request</button>
        </form>
    </div>
</body>
</html>
